<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>


</head>

<body>

    <div class="container">

        <div class="header">

            <h1>Update Student</h1>
            <p>Modify your Student information</p>
        </div>

        <form action="/update" method="post">

            <div class="form-group">
                <label>Current Student Name</label>
                <input type="text" name="up" class="up" placeholder="Enter existing Student name" required>
            </div>

            <div class="form-group">
                <label>Student New Name</label>
                <input type="text" name="name" class="name" placeholder="Enter new name" required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="number" name="number" class="number" placeholder="Enter new contact number" required>
            </div>

            <div class="form-group">
                <label>Enter Email</label>
                <input type="text" name="email" class="email" placeholder="Enter your email" required>
            </div>


            <div class="form-group">
                <label>Password</label>
                <input type="text" name="password" class="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" class="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Cours</label>
                <select name="cours" class="cours">
                    <option value="mern">Mern</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <button type="submit" class="update-btn">
                Update Student
            </button>

        </form>

        <a href="/" class="back">← Back to Dashboard</a>

    </div>

</body>

</html>
